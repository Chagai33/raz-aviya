:root{color-scheme:light;--bg:#FBF8F2;--ink:#4A4148;--mut:#655B67;--rose:#A85A73;--line:rgba(74,65,72,.22)}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg);margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);font:17px/1.5 'Fredoka',system-ui,sans-serif;overflow-x:clip}
main{flex:1;width:100%;max-width:420px;margin:0 auto;padding:40px 24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{margin:0;display:flex;align-items:center;justify-content:center;gap:10px;font:400 clamp(56px,17vw,76px)/1 'Gveret Levin',cursive;color:var(--ink)}
h1 svg{width:clamp(62px,18vw,80px);height:auto}
.venue{margin:30px 0 0}
.venue a{display:inline-flex;align-items:center;gap:6px;min-height:48px;color:var(--ink);text-decoration:none;font-size:25px}
.venue .vname{text-decoration:underline;text-decoration-color:var(--rose);text-decoration-thickness:2px;text-underline-offset:7px}
.wz{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px}
.wz img{width:28px;height:28px;display:block}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;margin:26px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.times div{padding:14px 6px}
.times div+div{border-inline-start:1px solid var(--line)}
.times b{display:block;font-weight:500;font-size:30px;line-height:1.15;white-space:nowrap}
.times span{color:var(--mut);font-size:17px}
.addcal{width:100%;margin-top:30px}
.addcal h2{margin:0 0 12px;font-weight:500;font-size:20px}
.cals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cal{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 16px;border-radius:999px;background:var(--rose);color:#fff;text-decoration:none;font-size:19px;font-weight:500}
a:focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:12px}
.meadow{line-height:0}
@media (prefers-reduced-motion:no-preference){.cal{transition:transform .15s}.cal:active{transform:scale(.97)}}
