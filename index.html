/* VOICE: quiet, warm. IDEA: a small card that follows the invitation.
   PICTURE: the names with the knot, small, for continuity.
   COLOUR and TYPE: invitation sand, ink and terracotta; Frank Ruhl Libre + IBM Plex Sans Hebrew.
   LAYOUT: one centered column: names, venue, times, one button. */
:root{color-scheme:light;--bg:#EFE7DA;--ink:#2B2620;--mut:#5C5349;--acc:#AE755E;--line:rgba(43,38,32,.25)}
*{box-sizing:border-box;min-width:0}
html,body{background:var(--bg);margin:0}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;color:var(--ink);font:17px/1.5 'IBM Plex Sans Hebrew',system-ui,sans-serif;overflow-x:clip}
main{flex:1;width:100%;max-width:420px;margin:0 auto;padding:40px 24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.names{display:block;width:min(240px,64vw);height:auto}
.venue{margin:30px 0 0}
.venue a{display:inline-flex;align-items:center;gap:10px;min-height:48px;color:var(--ink);text-decoration:none;font:700 30px/1.2 'Frank Ruhl Libre',serif}
.venue a{flex-wrap:wrap;justify-content:center}
.vname{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:7px}
.wz{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px}
.wz img{width:26px;height:26px;display:block}
.venue a:focus-visible,.cal:focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:12px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;margin:28px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.times div{padding:16px 6px}
.times div+div{border-inline-start:1px solid var(--line)}
.times b{display:block;font:400 34px/1.1 'Frank Ruhl Libre',serif;white-space:nowrap}
.times span{color:var(--mut);font-size:17px}
.addcal{width:100%;margin-top:34px}
.addcal h2{margin:0 0 14px;font:600 21px/1.3 'IBM Plex Sans Hebrew',sans-serif}
.cals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cal{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 16px;border-radius:999px;background:var(--acc);color:#fff;text-decoration:none;font-size:19px;font-weight:500}
.cal svg{width:26px;height:26px}
.grass{line-height:0}
@media (prefers-reduced-motion:no-preference){.cal{transition:transform .15s}.cal:active{transform:scale(.97)}}
</style>
